name: mateira

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mateira
      POSTGRES_PASSWORD: mateira
      POSTGRES_DB: mateira
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mateira"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
